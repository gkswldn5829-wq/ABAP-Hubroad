# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zc33approval.cl33fiproject0005
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://bgissap1.bgissap.co.kr:8000
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
        apps:
          - local:
              id: zc33approval.cl33fiproject0005
              intent:
                object: app
                action: preview
    # ★ beforeMiddleware: fiori-tools-proxy 로 설정해야 proxy보다 먼저 실행되어
    #   /sap/opu/odata OData 요청을 가로챌 수 있음
    #   beforeMiddleware: csp 는 proxy 이후에 실행되므로 mock이 절대 동작하지 않음
    - name: sap-fe-mockserver
      beforeMiddleware: fiori-tools-proxy
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZGWC3FI0002_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations: []
